set timeout=10
set default=0

set menu_color_normal=cyan/black
set menu_color_highlight=yellow/blue

menuentry "Boot AaronOS" {
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "Boot From Hard Disk" {
    insmod part_msdos
    set root=(hd0)
    chainloader +1
    boot
}

menuentry "Boot From CD" {
    insmod iso9660
    set root=(cd0)
    chainloader +1
    boot
}

menuentry "Shutdown" {
    halt
}
